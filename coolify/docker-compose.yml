services:
  api:
    build:
      context: .
      dockerfile: coolify/docker/api.Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_DEMO_MODE: ${APP_DEMO_MODE:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      API_PORT: ${API_PORT:-4000}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
      PUBLIC_SUPPORT_WHATSAPP: ${PUBLIC_SUPPORT_WHATSAPP}
      PUBLIC_SUPPORT_TELEGRAM: ${PUBLIC_SUPPORT_TELEGRAM}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    expose:
      - "${API_PORT:-4000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${API_PORT:-4000}/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: coolify/docker/worker.Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      APP_DEMO_MODE: ${APP_DEMO_MODE:-false}
    depends_on:
      api:
        condition: service_healthy

  ops-web:
    build:
      context: .
      dockerfile: coolify/docker/ops-web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_DEMO_MODE: ${NEXT_PUBLIC_APP_DEMO_MODE:-false}
        NEXT_PUBLIC_SUPPORT_WHATSAPP: ${NEXT_PUBLIC_SUPPORT_WHATSAPP}
        NEXT_PUBLIC_SUPPORT_TELEGRAM: ${NEXT_PUBLIC_SUPPORT_TELEGRAM}
    environment:
      NODE_ENV: production
      PORT: ${OPS_WEB_PORT:-3000}
      OPS_WEB_PORT: ${OPS_WEB_PORT:-3000}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_APP_DEMO_MODE: ${NEXT_PUBLIC_APP_DEMO_MODE:-false}
      NEXT_PUBLIC_SUPPORT_WHATSAPP: ${NEXT_PUBLIC_SUPPORT_WHATSAPP}
      NEXT_PUBLIC_SUPPORT_TELEGRAM: ${NEXT_PUBLIC_SUPPORT_TELEGRAM}
    command: >
      sh -lc "npm run start -w @flixify/ops-web -- --port ${OPS_WEB_PORT:-3000}"
    expose:
      - "${OPS_WEB_PORT:-3000}"
    depends_on:
      api:
        condition: service_healthy
