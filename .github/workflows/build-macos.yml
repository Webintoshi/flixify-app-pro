name: Build macOS Release

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/viewer-native-qt/**'
      - 'data/app-update-manifest.json'
      - '.github/workflows/build-macos.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'apps/viewer-native-qt/**'
      - 'data/app-update-manifest.json'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

concurrency:
  group: native-qt-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  QT_VERSION: '6.8.0'
  BUILD_PRESET: macos-universal-release
  LIBVLC_ROOT: /Applications/VLC.app/Contents/MacOS
  FLIXIFY_API_BASE_URL: ${{ vars.FLIXIFY_API_BASE_URL }}

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm

    - name: Install workspace dependencies
      run: npm ci

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: mac
        target: desktop
        arch: clang_64
        modules: 'qtmultimedia qtshadertools qt5compat'
        cache: true

    - name: Setup Ninja
      uses: ashutoshvarma/setup-ninja@master
      with:
        version: 1.12.1

    - name: Install VLC runtime
      run: brew install --cask vlc

    - name: Resolve Qt root
      shell: bash
      run: |
        qt_root="$(python3 - <<'PY'
import os
from pathlib import Path

seen = set()
candidates = []
for key in ("QT_ROOT", "QTDIR", "Qt6_DIR", "QT6_DIR", "QT_DIR"):
    raw = os.environ.get(key, "").strip()
    if not raw:
        continue
    path = Path(raw).expanduser()
    candidates.extend([path, path.parent, path.parent.parent])

for candidate in candidates:
    try:
        resolved = candidate.resolve()
    except FileNotFoundError:
        continue
    if resolved in seen:
        continue
    seen.add(resolved)
    if (resolved / "lib" / "cmake" / "Qt6" / "Qt6Config.cmake").exists():
        print(resolved)
        raise SystemExit(0)

print("")
PY
)"

        if [ -z "$qt_root" ]; then
          qt_root="$(find "$RUNNER_WORKSPACE" "$HOME" -path '*/lib/cmake/Qt6/Qt6Config.cmake' -print -quit | sed 's#/lib/cmake/Qt6/Qt6Config.cmake##')"
        fi

        if [ -z "$qt_root" ]; then
          echo "Unable to resolve QT_ROOT." >&2
          exit 1
        fi

        echo "QT_ROOT=$qt_root" >> "$GITHUB_ENV"
        echo "Resolved QT_ROOT=$qt_root"

    - name: Import Developer ID certificate
      if: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.MACOS_KEYCHAIN_PASSWORD != '' }}
      shell: bash
      env:
        MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      run: |
        keychain_path="$RUNNER_TEMP/flixify-signing.keychain-db"
        certificate_path="$RUNNER_TEMP/flixify-signing.p12"

        python3 - <<'PY'
import base64
import os
from pathlib import Path

certificate = os.environ["MACOS_CERT_P12_BASE64"].strip()
Path(os.environ["RUNNER_TEMP"]).joinpath("flixify-signing.p12").write_bytes(base64.b64decode(certificate))
PY

        security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
        security set-keychain-settings -lut 21600 "$keychain_path"
        security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"

        existing_keychains="$(security list-keychains -d user | tr -d '"' | xargs)"
        security list-keychains -d user -s "$keychain_path" $existing_keychains
        security default-keychain -d user -s "$keychain_path"

        security import "$certificate_path" \
          -k "$keychain_path" \
          -P "$MACOS_CERT_PASSWORD" \
          -T /usr/bin/codesign \
          -T /usr/bin/security

        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"

        identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
        if [ -z "$identity" ]; then
          echo "Developer ID Application identity not found." >&2
          exit 1
        fi

        echo "MACOS_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
        echo "Configured identity: $identity"

    - name: Package universal DMG
      run: npm run package -w @flixify/viewer-native-qt -- --preset $BUILD_PRESET
      env:
        QT_ROOT: ${{ env.QT_ROOT }}
        LIBVLC_ROOT: ${{ env.LIBVLC_ROOT }}
        FLIXIFY_API_BASE_URL: ${{ env.FLIXIFY_API_BASE_URL }}
        MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        MACOS_CODESIGN_IDENTITY: ${{ env.MACOS_CODESIGN_IDENTITY }}
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    - name: Verify universal slices
      shell: bash
      run: |
        app_binary="apps/viewer-native-qt/dist/${BUILD_PRESET}/stage/Flixify Pro.app/Contents/MacOS/Flixify Pro"
        lipo -info "$app_binary"

    - name: Verify code signing
      if: ${{ env.MACOS_CODESIGN_IDENTITY != '' }}
      shell: bash
      run: |
        app_bundle="apps/viewer-native-qt/dist/${BUILD_PRESET}/stage/Flixify Pro.app"
        codesign --verify --deep --strict "$app_bundle"
        spctl --assess --type execute --verbose "$app_bundle"

    - name: Verify notarization staples
      if: ${{ env.MACOS_CODESIGN_IDENTITY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_PRIVATE_KEY != '' && secrets.APPLE_TEAM_ID != '' }}
      shell: bash
      run: |
        app_bundle="apps/viewer-native-qt/dist/${BUILD_PRESET}/stage/Flixify Pro.app"
        dmg_path="$(find "apps/viewer-native-qt/dist/${BUILD_PRESET}" -maxdepth 1 -name '*.dmg' -print -quit)"
        xcrun stapler validate "$app_bundle"
        xcrun stapler validate "$dmg_path"

    - name: Upload macOS DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: FlixifyNativeQt-macOS-universal
        path: apps/viewer-native-qt/dist/${{ env.BUILD_PRESET }}/*.dmg
        if-no-files-found: error
        retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: FlixifyNativeQt-macOS-*
        merge-multiple: false

    - name: Get version from package.json
      id: get_version
      shell: bash
      run: |
        version="$(grep -oP '"version"\s*:\s*"\K[^"]+' apps/viewer-native-qt/package.json | head -1)"
        echo "VERSION=$version" >> "$GITHUB_OUTPUT"
        echo "Version: $version"

    - name: Publish Release Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.VERSION }}
        name: Flixify Pro v${{ steps.get_version.outputs.VERSION }}
        body: |
          ## Flixify Pro macOS Release v${{ steps.get_version.outputs.VERSION }}

          ### Icerik
          - Apple Silicon ve Intel uyumlu universal DMG
          - Native macOS playback surface ve pencere davranislari
          - Signed + notarized release pipeline icin hazir workflow

          ### Kurulum
          1. `Flixify-Pro-${{ steps.get_version.outputs.VERSION }}-macos-universal.dmg` dosyasini indirin
          2. DMG icindeki `Flixify Pro.app` uygulamasini `Applications` klasorune surukleyin
          3. Uygulamayi Finder veya Launchpad uzerinden baslatin
        files: artifacts/FlixifyNativeQt-macOS-universal/**/*
        append_body: true
        fail_on_unmatched_files: true
        overwrite_files: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
