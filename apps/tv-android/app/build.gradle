plugins { id 'com.android.application' }
def analyticsFile = file('google-services.json')
def analyticsClient = null
def analyticsProject = [:]
if (analyticsFile.exists()) {
    def config = new groovy.json.JsonSlurper().parse(analyticsFile)
    analyticsClient = config.client.find { it.client_info?.android_client_info?.package_name == 'vip.flixify.tv' }
    analyticsProject = config.project_info
    if (!analyticsClient?.client_info?.mobilesdk_app_id || !analyticsClient?.api_key?.getAt(0)?.current_key || !analyticsProject?.project_id || !analyticsProject?.project_number) {
        throw new GradleException('Firebase public configuration is invalid for vip.flixify.tv')
    }
}
android {
    namespace 'vip.flixify.tv'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'vip.flixify.tv'
        minSdk 23
        targetSdk 35
        versionCode 21
        versionName '1.4.13'
        buildConfigField 'boolean', 'FLIXIFY_ANALYTICS_CONFIGURED', analyticsClient != null ? 'true' : 'false'
        buildConfigField 'String', 'FIREBASE_APP_ID', groovy.json.JsonOutput.toJson(analyticsClient?.client_info?.mobilesdk_app_id ?: '')
        buildConfigField 'String', 'FIREBASE_API_KEY', groovy.json.JsonOutput.toJson(analyticsClient?.api_key?.getAt(0)?.current_key ?: '')
        buildConfigField 'String', 'FIREBASE_PROJECT_ID', groovy.json.JsonOutput.toJson(analyticsProject?.project_id ?: '')
        buildConfigField 'String', 'FIREBASE_SENDER_ID', groovy.json.JsonOutput.toJson(analyticsProject?.project_number ?: '')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug'; buildConfigField 'boolean', 'FLIXIFY_ANALYTICS_CONFIGURED', 'false' }
        release {
            debuggable false
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
    sourceSets { test.resources.srcDir rootProject.file('../../packages/contracts/test-fixtures') }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
}
dependencies {
    implementation 'com.google.firebase:firebase-analytics:23.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
