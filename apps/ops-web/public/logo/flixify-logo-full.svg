<?xml version="1.0" encoding="UTF-8"?>
<!--
  🎬 FLIXIFY PRO - Full Logo (Icon + Wordmark)
  For website headers, marketing materials, splash screens
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff1a26"/>
      <stop offset="100%" style="stop-color:#c0040e"/>
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e0e0"/>
    </linearGradient>
    
    <filter id="logoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon -->
  <g transform="translate(0, 20)">
    <rect width="160" height="160" rx="40" fill="url(#logoGradient)" filter="url(#logoGlow)"/>
    <rect x="12" y="12" width="136" height="136" rx="28" 
          fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
    <path d="M 65 50 L 115 90 L 65 130 Z" fill="white"/>
  </g>
  
  <!-- Wordmark: FLIXIFY -->
  <g transform="translate(190, 55)">
    <text x="0" y="75" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="90" 
          font-weight="800" 
          letter-spacing="-2"
          fill="url(#textGrad)">
      FLIXIFY
    </text>
  </g>
  
  <!-- PRO Badge -->
  <g transform="translate(580, 85)">
    <rect width="100" height="48" rx="12" fill="#f40612"/>
    <text x="50" y="34" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="28" 
          font-weight="700" 
          fill="white" 
          text-anchor="middle">
      PRO
    </text>
  </g>
</svg>
