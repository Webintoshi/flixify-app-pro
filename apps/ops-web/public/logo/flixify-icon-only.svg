<?xml version="1.0" encoding="UTF-8"?>
<!--
  🎬 FLIXIFY PRO - Icon Only (for system tray, favicon, small sizes)
  Pure icon without text - best for 16x16 to 64x64
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff1a26"/>
      <stop offset="100%" style="stop-color:#c0040e"/>
    </linearGradient>
    
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f40612" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="120" fill="url(#iconBg)" filter="url(#iconShadow)"/>
  
  <!-- Inner border -->
  <rect x="24" y="24" width="464" height="464" rx="96" 
        fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8"/>
  
  <!-- Play button -->
  <path d="M 196 156 L 356 256 L 196 356 Z" fill="white"/>
  
  <!-- Subtle F letter -->
  <path d="M 116 116 L 116 396" stroke="rgba(255,255,255,0.1)" stroke-width="32" stroke-linecap="round"/>
  <path d="M 116 116 L 276 116" stroke="rgba(255,255,255,0.1)" stroke-width="32" stroke-linecap="round"/>
</svg>
