<!--
  🎬 FLIXIFY PRO - HTML Head Example
  Copy these meta tags to your index.html or layout.tsx head section
-->

<!-- Primary Meta Tags -->
<meta name="title" content="Flixify Pro">
<meta name="description" content="Premium IPTV deneyimi. Yüksek kaliteli yayınlar, geniş kanal seçenekleri.">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://flixify.pro/">
<meta property="og:title" content="Flixify Pro">
<meta property="og:description" content="Premium IPTV deneyimi">
<meta property="og:image" content="https://flixify.pro/logo/flixify-icon.svg">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="https://flixify.pro/">
<meta property="twitter:title" content="Flixify Pro">
<meta property="twitter:description" content="Premium IPTV deneyimi">
<meta property="twitter:image" content="https://flixify.pro/logo/flixify-icon.svg">

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="/logo/flixify-icon-only.svg">
<link rel="alternate icon" href="/favicon.ico">
<link rel="mask-icon" href="/logo/flixify-icon-only.svg" color="#f40612">

<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" sizes="180x180" href="/logo/flixify-icon.svg">

<!-- PWA Manifest -->
<link rel="manifest" href="/logo/site.webmanifest">

<!-- Theme Color -->
<meta name="theme-color" content="#f40612">
<meta name="msapplication-TileColor" content="#060606">
<meta name="msapplication-config" content="/browserconfig.xml">

<!-- Safari Pinned Tab -->
<link rel="mask-icon" href="/logo/flixify-icon-only.svg" color="#f40612">
