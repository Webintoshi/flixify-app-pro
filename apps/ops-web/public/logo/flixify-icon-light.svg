<?xml version="1.0" encoding="UTF-8"?>
<!--
  🎬 FLIXIFY PRO - Light Background Version
  For white/light backgrounds
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="lightIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff1a26"/>
      <stop offset="100%" style="stop-color:#c0040e"/>
    </linearGradient>
    
    <filter id="lightShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- White background circle -->
  <rect width="512" height="512" rx="120" fill="white"/>
  
  <!-- Inner icon -->
  <rect x="56" y="56" width="400" height="400" rx="100" fill="url(#lightIconBg)"/>
  
  <!-- Play button -->
  <path d="M 206 156 L 326 256 L 206 356 Z" fill="white"/>
</svg>
