<?xml version="1.0" encoding="UTF-8"?>
<!--
  🎬 FLIXIFY PRO - App Icon (Master)
  Platform: Windows, macOS, Linux, iOS, Android, Web
  Usage: Convert to .ico, .icns, PNG set for distribution
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1f"/>
      <stop offset="100%" style="stop-color:#0d0d10"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff1a26"/>
      <stop offset="50%" style="stop-color:#f40612"/>
      <stop offset="100%" style="stop-color:#c0040e"/>
    </linearGradient>
    
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4d57;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#f40612;stop-opacity:0"/>
    </linearGradient>
    
    <!-- Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="40" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="1024" rx="240" fill="url(#bgGradient)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
    <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="2"/>
  </pattern>
  <rect width="1024" height="1024" rx="240" fill="url(#grid)"/>
  
  <!-- Outer glow ring -->
  <rect x="72" y="72" width="880" height="880" rx="200" 
        fill="none" stroke="url(#glowGradient)" stroke-width="8" opacity="0.6"/>
  
  <!-- Main icon container -->
  <g transform="translate(212, 212)" filter="url(#shadow)">
    <!-- TV Screen shape with rounded corners -->
    <rect x="0" y="0" width="600" height="500" rx="80" 
          fill="url(#accentGradient)"/>
    
    <!-- Inner highlight -->
    <rect x="20" y="20" width="560" height="460" rx="60" 
          fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
    
    <!-- Play triangle -->
    <path d="M 250 180 L 380 280 L 250 380 Z" fill="white"/>
    
    <!-- F letter hint (subtle) -->
    <path d="M 140 120 L 140 420" stroke="rgba(255,255,255,0.15)" stroke-width="24" stroke-linecap="round"/>
    <path d="M 140 120 L 300 120" stroke="rgba(255,255,255,0.15)" stroke-width="24" stroke-linecap="round"/>
    <path d="M 140 260 L 260 260" stroke="rgba(255,255,255,0.15)" stroke-width="24" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom stand/base -->
  <g transform="translate(362, 732)">
    <path d="M 0 0 L 300 0 L 260 60 L 40 60 Z" fill="#1a1a1f"/>
    <rect x="130" y="60" width="40" height="40" fill="#1a1a1f"/>
    <ellipse cx="150" cy="100" rx="100" ry="20" fill="#0d0d10"/>
  </g>
</svg>
